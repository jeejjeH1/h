<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>تاریخ هوش مصنوعی</title>
<style>
  @font-face { font-family: Vazirmatn; src: url(../fonts/Vazirmatn-Regular.ttf); font-weight: 400 600; }
  @font-face { font-family: Vazirmatn; src: url(../fonts/Vazirmatn-Bold.ttf); font-weight: 700 800; }
  @font-face { font-family: Vazirmatn; src: url(../fonts/Vazirmatn-Black.ttf); font-weight: 900; }
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: auto; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="content.js"></script>
<script src="voice.js"></script>
<script>
  window.READY = Promise.all([400, 600, 700, 800, 900].map(w => document.fonts.load(`${w} 40px Vazirmatn`, 'هوش AI')))
    .then(() => new Promise(res => { const s = document.createElement('script'); s.src = 'engine.js'; s.onload = res; document.body.appendChild(s); }))
    .then(() => {
      if (!location.search.includes('render')) {
        const t0 = performance.now(); const m = location.hash.match(/t=([\d.]+)/); const off = m ? +m[1] : 0;
        const loop = () => { render(((performance.now() - t0) / 1000 + off) % TOTAL); requestAnimationFrame(loop); }; loop();
      }
    });
</script>
</body>
</html>
