<!doctype html><meta charset="utf-8">
<style>
@font-face{font-family:V;src:url(../fonts/Vazirmatn-Black.ttf);font-weight:900}
@font-face{font-family:V;src:url(../fonts/Vazirmatn-Bold.ttf);font-weight:700}
html,body{margin:0}
.t{width:1280px;height:720px;position:relative;overflow:hidden;font-family:V;direction:rtl;
 background:radial-gradient(circle at 28% 50%,#123a6a 0%,#071229 45%,#02040a 100%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(#4fe3ff14 1px,transparent 1px),linear-gradient(90deg,#4fe3ff14 1px,transparent 1px);background-size:40px 40px}
.brain{position:absolute;left:40px;top:90px;width:560px;height:560px}
.h1{position:absolute;right:50px;top:70px;font-weight:900;font-size:92px;color:#fff;text-shadow:0 0 30px #4fe3ff88,0 6px 0 #000}
.h2{position:absolute;right:50px;top:190px;font-weight:900;font-size:150px;line-height:1;background:linear-gradient(90deg,#b58cff,#7ff0ff);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 0 25px #7ff0ff88)}
.tag{position:absolute;right:50px;top:400px;font-weight:900;font-size:62px;background:#ffd400;color:#111;padding:6px 30px;transform:rotate(-2deg)}
.years{position:absolute;right:56px;top:530px;font-weight:700;font-size:44px;color:#cfe9ff}
.years b{color:#10e3a0}
</style>
<div class="t"><div class="grid"></div>
<svg class="brain" viewBox="0 0 560 560">
 <defs><radialGradient id="g"><stop offset="0" stop-color="#7ff0ff" stop-opacity=".9"/><stop offset="1" stop-color="#7ff0ff" stop-opacity="0"/></radialGradient>
 <filter id="f"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
 <circle cx="280" cy="280" r="250" fill="url(#g)" opacity=".25"/>
 <g id="net" stroke="#4fe3ff" stroke-opacity=".5" stroke-width="2" filter="url(#f)"></g>
</svg>
<div class="h1">تاریخ کامل</div>
<div class="h2">هوش مصنوعی</div>
<div class="tag">از رؤیا تا ChatGPT</div>
<div class="years">از افسانه‌های باستان ← <b>امروز</b></div>
</div>
<script>
const g=document.getElementById('net');let pts=[];
for(let i=0;i<60;i++){const a=Math.sin(i*12.9898)*43758.5453;const r=a-Math.floor(a);const b=Math.sin(i*78.233)*43758.5453;const q=b-Math.floor(b);
const ang=r*6.283,rad=40+q*200;pts.push([280+Math.cos(ang)*rad*1.1,280+Math.sin(ang)*rad*0.85]);}
pts.forEach((p,i)=>{[1,7,13].forEach(k=>{const o=pts[(i+k)%60];const l=document.createElementNS('http://www.w3.org/2000/svg','line');l.setAttribute('x1',p[0]);l.setAttribute('y1',p[1]);l.setAttribute('x2',o[0]);l.setAttribute('y2',o[1]);g.appendChild(l);});});
pts.forEach((p,i)=>{const c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('cx',p[0]);c.setAttribute('cy',p[1]);c.setAttribute('r',i%5?5:9);c.setAttribute('fill',i%5?'#7ff0ff':'#b58cff');g.appendChild(c);});
</script>
